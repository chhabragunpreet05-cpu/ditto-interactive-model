<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditto: What do you need to believe?</title>
<style>
:root{--bg:#EEF4FB;--card:#fff;--ink:#12263F;--mut:#5B6B80;--line:#D3DEEB;--navy:#18395A;--blue:#1E7BE4;--lt:#63ADF9;--g:#1E9E5A;--a:#E0A100;--r:#D6423A;--gb:#DDF3E7;--ab:#FFF1CC;--rb:#FBDDDA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1623;--card:#13243A;--ink:#E6EEF8;--mut:#93A6BD;--line:#27405E;--navy:#63ADF9;--gb:#12392A;--ab:#43380F;--rb:#4A1F1D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:18px 20px 6px;max-width:1200px;margin:auto}
h1{font-size:24px;margin:0 0 4px;color:var(--navy);letter-spacing:-.01em}
header p{margin:0;color:var(--mut);max-width:70ch}
main{display:grid;grid-template-columns:330px 1fr;gap:16px;max-width:1200px;margin:auto;padding:12px 20px 30px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.sl{margin-bottom:12px}.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:13px;cursor:help}
.sl input[type=range]{width:100%;accent-color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer}
button:hover,button:focus-visible{background:var(--blue);color:#fff;outline:none}
.verdict{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge{font-size:32px;font-weight:800;padding:6px 20px;border-radius:8px}
.BUY{background:var(--gb);color:var(--g)}.HOLD{background:var(--ab);color:var(--a)}.SELL{background:var(--rb);color:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px}.kpi b{display:block;font-size:19px}.kpi span{font-size:12px;color:var(--mut)}
.gauge{position:relative;height:12px;background:linear-gradient(90deg,var(--rb),var(--ab) 50%,var(--gb));border-radius:6px;margin:22px 0 6px}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;background:var(--navy);border-radius:2px}
.gauge u{position:absolute;top:-5px;width:12px;height:22px;background:var(--blue);border-radius:6px;transform:translateX(-50%);text-decoration:none}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.right{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px;text-align:center;border:1px solid var(--line)}
td.G{background:var(--gb)}td.A{background:var(--ab)}td.R{background:var(--rb)}td.now{outline:3px solid var(--navy);outline-offset:-3px;font-weight:700}
.need p{margin:4px 0}.small{font-size:12px;color:var(--mut)}
.prob input{width:60px}
svg text{fill:var(--ink);font-size:10px}
.print .controls,.print .detail{display:none}.print main{grid-template-columns:1fr}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
details label{display:flex;justify-content:space-between;margin:6px 0;font-size:13px}details input{width:80px}
#tb{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}#tb button.act{background:var(--blue);color:#fff}
.tabpane{display:none}.tabpane.on{display:grid}
.print #tb,.print #out2,.print #out3{display:none!important}.print #out{display:grid!important}
td.L,th.L{text-align:left}td input{width:70px}.pin{margin-left:6px}
</style></head><body>
<header><h1>Ditto: what do you need to believe?</h1>
<p>Move the assumptions and see whether ₹500 earns your hurdle return over five years (FY26 to FY31). Base settings reproduce the team’s ₹823 target and 10.5% CAGR.</p></header>
<main>
<aside class="controls card">
<h2>Assumptions</h2>
<div class="btns" id="pre"></div>
<div id="sl"></div>
<button id="reset">Reset to base</button> <button id="prt">Verdict-only view</button>
<details style="margin-top:12px"><summary>Advanced assumptions</summary><div id="adv"></div></details>
</aside>
<section><nav id="tb"></nav><div class="right tabpane on" id="out"></div><div class="right tabpane" id="out2"></div><div class="right tabpane" id="out3"></div></section>
</main>
<p class="small" style="max-width:1200px;margin:0 auto;padding:0 20px 20px">Illustrative case analysis, not investment advice.</p>
<script>
const SL=[
['cagr','Revenue CAGR, FY27 to FY31',10,60,.5,27.8,'%','Yearly revenue growth from the FY27E base of ₹600 Cr.'],
['margin','FY31 EBITDA margin',10,30,.5,21,'%','Target EBITDA margin before wage and cap effects.'],
['wage','Advisor wage inflation',5,18,.5,9,'%','Yearly salary growth. Anything above the base 9% eats margin.'],
['cap','Commission-cap hit',0,15,.5,0,'%','Share of FY31 revenue lost to the IRDAI 15%/5% caps; flows straight to EBITDA.'],
['pe','Exit P/E multiple',20,70,1,38,'x','P/E the market pays on FY31 profit.'],
['entry','Entry price',300,600,5,500,'₹','Price you pay today per share.'],
['hurdle','Hurdle rate',10,18,.5,14,'%','Minimum yearly return the committee requires.']];
const A0={shares:12,rev27:600,pat27:65,adv:38,basew:9,conv:77.38};
let A={...A0},V={};
const $=id=>document.getElementById(id);
const n0=x=>isFinite(x)?Math.round(x).toLocaleString('en-IN'):'n/a';
const pc=x=>isFinite(x)?(x*100).toFixed(1)+'%':'n/a';
function calc(p){
 const rev=A.rev27*Math.pow(1+p.cagr/100,4);
 const drag=A.adv/100*(Math.pow((1+p.wage/100)/(1+A.basew/100),4)-1);
 const m=p.margin/100-drag-p.cap/100;
 const e=rev*m, pat=Math.max(e*A.conv/100,0), mc=pat*p.pe, price=mc/A.shares;
 const c=price>0?Math.pow(price/p.entry,.2)-1:-1;
 return{rev,m,e,pat,mc,price,c,buy:price/Math.pow(1+p.hurdle/100,5)};
}
const verdict=(c,h)=>c>=h/100?'BUY':c>=h/100-.04?'HOLD':'SELL';
const PRE={Bear:{cagr:22,margin:17,wage:11,cap:5,pe:28},Base:{cagr:27.8,margin:21,wage:9,cap:0,pe:38},Bull:{cagr:32,margin:25,wage:9,cap:0,pe:42}};

function solveG(p){const t=p.entry*Math.pow(1+p.hurdle/100,5);let lo=0,hi=200;
 if(calc({...p,cagr:hi}).price<t)return NaN;
 for(let i=0;i<60;i++){const mid=(lo+hi)/2;calc({...p,cagr:mid}).price<t?lo=mid:hi=mid}return (lo+hi)/2}
function build(){
 $('sl').innerHTML=SL.map(s=>`<div class="sl"><label title="${s[7]}"><span>${s[1]}</span><b id="v_${s[0]}"></b></label><input type="range" id="${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${s[5]}" title="${s[7]}" aria-label="${s[1]}"></div>`).join('');
 SL.forEach(s=>$(s[0]).oninput=r);
 const pb=Object.keys(PRE).concat(["Seller’s ask"]);
 $('pre').innerHTML=pb.map(k=>`<button data-k="${k}">${k}</button>`).join('');
 $('pre').onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  if(k=='Bear'||k=='Base'||k=='Bull')set(PRE[k]);
  else{const p={...read(),margin:21,wage:9,cap:0,pe:38,entry:500};const g=solveG(p);set({margin:21,wage:9,cap:0,pe:38,entry:500,cagr:isNaN(g)?60:Math.min(60,Math.round(g*2)/2)})}};
 const L={shares:'Shares (Cr)',rev27:'FY27E revenue (₹ Cr)',pat27:'FY27E PAT (₹ Cr)',adv:'Advisor cost share of revenue (%)',basew:'Base wage inflation (%)',conv:'PAT / EBITDA (%)'};
 $('adv').innerHTML=Object.keys(L).map(k=>`<label>${L[k]}<input type="number" step="any" id="a_${k}" value="${A[k]}"></label>`).join('');
 Object.keys(L).forEach(k=>$('a_'+k).oninput=()=>{A[k]=parseFloat($('a_'+k).value)||A0[k];r()});
 $('reset').onclick=()=>{set(Object.fromEntries(SL.map(s=>[s[0],s[5]])))};
 $('prt').onclick=()=>document.body.classList.toggle('print');
}
function set(o){for(const k in o)$(k).value=o[k];r()}
function read(){const p={};SL.forEach(s=>p[s[0]]=parseFloat($(s[0]).value));return p}
function bars(p,R){
 const rows=[];let mx=0;for(let i=0;i<5;i++){const rev=A.rev27*Math.pow(1+p.cagr/100,i),m=.15+(R.m-.15)*i/4;rows.push([2027+i,rev,rev*m]);mx=Math.max(mx,rev)}
 return`<svg viewBox="0 0 400 170" width="100%" role="img" aria-label="Revenue and EBITDA path">`+rows.map((r,i)=>{const x=20+i*76,h1=r[1]/mx*110,h2=Math.max(r[2],0)/mx*110;
 return`<rect x="${x}" y="${130-h1}" width="30" height="${h1}" fill="#63ADF9"/><rect x="${x+32}" y="${130-h2}" width="30" height="${h2}" fill="#18395A"/><text x="${x}" y="${124-h1}">${n0(r[1])}</text><text x="${x+32}" y="${124-h2}">${n0(r[2])}</text><text x="${x+10}" y="145">FY${String(r[0]).slice(2)}E</text>`}).join('')+`<text x="20" y="165">Light = revenue, dark = EBITDA (₹ Cr)</text></svg>`}
function wf(p,R){
 const v0=p.entry*A.shares,pe0=v0/A.pat27,v1=(R.pat-A.pat27)*pe0,v2=R.pat*(p.pe-pe0),end=R.mc;
 const lv=[[0,v0],[v0,v0+v1],[v0+v1,v0+v1+v2],[0,end]],lab=['Today','Earnings growth','Multiple change','FY31 mkt cap'],val=[v0,v1,v2,end];
 const mx=Math.max(...lv.flat(),1);
 return`<svg viewBox="0 0 400 170" width="100%" role="img" aria-label="Returns bridge">`+lv.map((l,i)=>{const a=Math.min(...l),b=Math.max(...l),y=130-b/mx*105,h=Math.max((b-a)/mx*105,1),x=15+i*95,c=i==0||i==3?'#18395A':(val[i]>=0?'#1E9E5A':'#D6423A');
 return`<rect x="${x}" y="${y}" width="70" height="${h}" fill="${c}"/><text x="${x}" y="${y-4}">${(val[i]>=0&&i%3?'+':'')+n0(val[i])}</text><text x="${x}" y="147">${lab[i]}</text>`}).join('')+`<text x="15" y="165">₹ Cr. Today’s multiple: ${pe0.toFixed(1)}x FY27E earnings</text></svg>`}
function r(){
 const p=read();V=p;SL.forEach(s=>$('v_'+s[0]).textContent=(s[6]=='₹'?'₹':'')+p[s[0]]+(s[6]=='₹'?'':s[6]));
 const R=calc(p),h=p.hurdle/100,vd=verdict(R.c,p.hurdle);
 const reqPE=p.entry*Math.pow(1+h,5)*A.shares/R.pat,reqG=solveG(p);
 const gp=Math.max(0,Math.min(1,(R.c+.1)/.4)),hp=(h+.1)/.4;
 const cols=[25,30,38,45,55],rowsG=[15,20,25,30,35,40];
 const nr=rowsG.reduce((a,b)=>Math.abs(b-p.cagr)<Math.abs(a-p.cagr)?b:a),nc=cols.reduce((a,b)=>Math.abs(b-p.pe)<Math.abs(a-p.pe)?b:a);
 const heat=`<table><tr><th>CAGR \\ exit P/E</th>${cols.map(c=>`<th>${c}x</th>`).join('')}</tr>`+rowsG.map(g=>`<tr><th>${g}%</th>`+cols.map(c=>{const x=calc({...p,cagr:g,pe:c}).c;return`<td class="${x>=h?'G':x>=h-.04?'A':'R'}${g==nr&&c==nc?' now':''}">${pc(x)}</td>`}).join('')+'</tr>').join('')+'</table>';
 const pw=$('pw')?[...document.querySelectorAll('.prob input')].map(i=>parseFloat(i.value)||0):[30,50,20];
 const sc=['Bear','Base','Bull'].map(k=>calc({...p,...PRE[k]}).price),tot=pw.reduce((a,b)=>a+b,0)||1;
 const ep=sc.reduce((s,x,i)=>s+x*pw[i]/tot,0),ec=ep>0?Math.pow(ep/p.entry,.2)-1:-1;
 $('out').innerHTML=`
 <div class="card"><div class="verdict"><div class="badge ${vd}">${vd}</div><div><b>${pc(R.c)} a year</b> vs ${p.hurdle}% hurdle at ₹${p.entry}<br><span class="small">BUY at or above the hurdle, HOLD within 4 points below, SELL beyond that.</span></div></div>
 <div class="gauge"><i style="left:${hp*100}%" title="hurdle"></i><u style="left:${gp*100}%" title="return"></u></div><div class="gl"><span>−10%</span><span>Dark line: hurdle · Blue: this case</span><span>+30%</span></div>
 <div class="kpis"><div class="kpi"><b>₹${n0(R.rev)}</b><span>FY31 revenue (Cr)</span></div><div class="kpi"><b>₹${n0(R.e)}</b><span>FY31 EBITDA (Cr)</span></div><div class="kpi"><b>₹${n0(R.pat)}</b><span>FY31 PAT (Cr)</span></div><div class="kpi"><b>₹${n0(R.mc)}</b><span>FY31 market cap (Cr)</span></div><div class="kpi"><b>₹${n0(R.price)}</b><span>FY31 target price</span></div><div class="kpi"><b>₹${n0(R.buy)}</b><span>Buy below (meets hurdle)</span></div></div></div>
 <div class="card need"><h2>What you need to believe</h2>
 <p>With these settings, a ${p.hurdle}% return needs an exit P/E of <b>${isFinite(reqPE)?reqPE.toFixed(1)+'x':'n/a'}</b>.</p>
 <p>Holding everything else, it needs revenue CAGR of <b>${isNaN(reqG)?'more than 200%':reqG.toFixed(1)+'%'}</b> a year from FY27 to FY31.</p>
 <p>The market price implies <b>${(p.entry*A.shares/A.pat27).toFixed(1)}x</b> FY27E earnings today.</p></div>
 <div class="two detail"><div class="card"><h2>Revenue and EBITDA path</h2>${bars(p,R)}</div><div class="card"><h2>Returns bridge</h2>${wf(p,R)}</div></div>
 <div class="card detail"><h2>5-year return by growth and exit multiple</h2><div class="scroll">${heat}</div><p class="small">Green meets the hurdle, amber is within 4 points, red is below. Outlined cell is closest to your sliders.</p></div>
 <div class="card detail prob"><h2>Probability-weighted view</h2>
 <p>Bear <input type="number" value="${pw[0]}"> % · Base <input type="number" value="${pw[1]}"> % · Bull <input type="number" value="${pw[2]}"> %<span id="pw"></span></p>
 <p>Scenario prices: ₹${n0(sc[0])} / ₹${n0(sc[1])} / ₹${n0(sc[2])}. Expected FY31 price <b>₹${n0(ep)}</b>, expected return <b>${pc(ec)}</b> a year.</p>
 <p class="small">Scenario inputs: see presets. Probabilities are normalised to 100.</p></div>`;
 document.querySelectorAll('.prob input').forEach(i=>i.onchange=r);
}
let tab=0,PINS=[];
const T={pers:85,ppa:304,ren:25,ltv:4.3,wage:9},RP={a:40,b:40,c:20};
const REG=[['Caps pass as proposed',8],['Caps watered down',3],['Caps delayed or withdrawn',0]];
const TR=[['pers','13th-month persistency (%)',84,82,1],['ppa','Policies per advisor',330,300,1],['ren','Renewal share of revenue (%)',29,25,1],['ltv','LTV : CAC (x)',4,3,1],['wage','Advisor wage inflation (%)',10,12,-1]];
const st=(v,g,x,d)=>d>0?(v>=g?'G':v>=x?'A':'R'):(v<=g?'G':v<=x?'A':'R');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tri(u,a,m,b){const f=(m-a)/(b-a);return u<f?a+Math.sqrt(u*(b-a)*(m-a)):b-Math.sqrt((1-u)*(b-a)*(b-m))}
function mc(p){const r=rng(42),N=4000,o=[];for(let i=0;i<N;i++){o.push(calc({...p,cagr:tri(r(),p.cagr-7,p.cagr,p.cagr+5),margin:tri(r(),Math.max(5,p.margin-5),p.margin,p.margin+3),wage:tri(r(),p.wage-1,p.wage,p.wage+4),cap:tri(r(),0,p.cap,p.cap+8),pe:tri(r(),Math.max(10,p.pe-12),p.pe,p.pe+8)}))}
 const h=p.hurdle/100,ps=o.map(x=>x.price).sort((a,b)=>a-b),q=f=>ps[Math.floor(f*(N-1))],bins=Array(15).fill(0);
 o.forEach(x=>bins[Math.max(0,Math.min(14,Math.floor((x.c+.3)/.04)))]++);
 return{beat:o.filter(x=>x.c>=h).length/N,loss:o.filter(x=>x.price<p.entry).length/N,p10:q(.1),med:q(.5),p90:q(.9),bins}}
function hist(M,p){const mx=Math.max(...M.bins),hx=20+Math.max(0,Math.min(.6,p.hurdle/100+.3))/.6*360;
 return`<svg viewBox="0 0 400 150" width="100%" role="img" aria-label="Return distribution">`+M.bins.map((c,i)=>{const hh=c/mx*100,ok=(-.3+i*.04)>=p.hurdle/100-.0001;return`<rect x="${20+i*24}" y="${110-hh}" width="22" height="${hh}" fill="${ok?'#1E9E5A':'#63ADF9'}"/>`}).join('')+`<line x1="${hx}" x2="${hx}" y1="5" y2="112" stroke="#D6423A" stroke-width="2"/><text x="${hx+3}" y="14">hurdle</text><text x="14" y="126">−30%</text><text x="192" y="126">0%</text><text x="370" y="126">+30%</text><text x="20" y="145">5-year return (CAGR) across 4,000 random cases. Green meets the hurdle.</text></svg>`}
function tornado(p){const F=[['cagr','Revenue CAGR',3,'pp'],['margin','EBITDA margin',2,'pp'],['wage','Wage inflation',2,'pp'],['cap','Cap hit',2,'pp'],['pe','Exit P/E',4,'x']],b=calc(p).price;
 const rows=F.map(([k,l,d,u])=>{const a=calc({...p,[k]:Math.max(0,p[k]-d)}).price,c=calc({...p,[k]:p[k]+d}).price;return{l:`${l} ±${d}${u}`,lo:Math.min(a,c),hi:Math.max(a,c)}}).sort((x,y)=>(y.hi-y.lo)-(x.hi-x.lo));
 const m=Math.max(...rows.map(r=>Math.max(b-r.lo,r.hi-b)),1),s=170/m,H=rows.length*30;
 return`<svg viewBox="0 0 400 ${H+22}" width="100%" role="img" aria-label="Tornado chart">`+rows.map((r,i)=>{const y=i*30+4;return`<text x="4" y="${y+9}">${r.l}: ₹${n0(r.lo)} to ₹${n0(r.hi)}</text><rect x="${200-(b-r.lo)*s}" y="${y+13}" width="${(b-r.lo)*s}" height="11" fill="#D6423A"/><rect x="200" y="${y+13}" width="${(r.hi-b)*s}" height="11" fill="#1E9E5A"/>`}).join('')+`<line x1="200" x2="200" y1="0" y2="${H}" stroke="#5B6B80"/><text x="140" y="${H+14}">Base FY31 price ₹${n0(b)}</text></svg>`}
function r2(p,R){const h=p.hurdle/100,M=mc(p),pk=['a','b','c'],tot=(RP.a+RP.b+RP.c)||1;
 const rg=REG.map(o=>{const x=calc({...p,cap:o[1]});return{n:o[0],cap:o[1],price:x.price,c:x.c}}),wp=rg.reduce((s,x,i)=>s+x.price*RP[pk[i]]/tot,0),wc=wp>0?Math.pow(wp/p.entry,.2)-1:-1;
 $('out2').innerHTML=`<div class="card"><h2>Which assumption matters most? (tornado)</h2>${tornado(p)}<p class="small">Each input is flexed up and down by a plausible amount while the others stay put. Longest bar = biggest swing in FY31 price.</p></div>
 <div class="card"><h2>Monte Carlo: how often does ₹${p.entry} clear ${p.hurdle}%?</h2><div class="kpis"><div class="kpi"><b>${(M.beat*100).toFixed(0)}%</b><span>Chance of beating hurdle</span></div><div class="kpi"><b>${(M.loss*100).toFixed(0)}%</b><span>Chance of losing money</span></div><div class="kpi"><b>₹${n0(M.med)}</b><span>Median FY31 price</span></div><div class="kpi"><b>₹${n0(M.p10)} to ₹${n0(M.p90)}</b><span>10th to 90th percentile</span></div></div>${hist(M,p)}<p class="small">Draws are centred on your sliders: CAGR −7/+5pp, margin −5/+3pp, wage −1/+4pp, cap hit up to +8pp, exit P/E −12/+8x (triangular). These ranges are our judgement; edit the code or tell us to change them.</p></div>
 <div class="card"><h2>IRDAI outcome switch</h2><div class="scroll"><table><tr><th class="L">Outcome</th><th>Revenue lost</th><th>FY31 price</th><th>Return</th><th>Probability %</th><th></th></tr>${rg.map((x,i)=>`<tr><td class="L">${x.n}</td><td>${x.cap}%</td><td>₹${n0(x.price)}</td><td class="${x.c>=h?'G':x.c>=h-.04?'A':'R'}">${pc(x.c)}</td><td><input type="number" data-rp="${pk[i]}" value="${RP[pk[i]]}"></td><td><button data-cap="${x.cap}">Apply</button></td></tr>`).join('')}</table></div>
 <p>Probability-weighted FY31 price <b>₹${n0(wp)}</b>, return <b>${pc(wc)}</b> a year.</p><button data-derate="1">Apply PB Fintech-style de-rating (exit P/E −36%)</button><p class="small">Cap-hit sizes and probabilities are placeholders until you source them. The −36% mirrors the one-day PB Fintech fall cited in the deck.</p></div>`}
function r3(p,R){const h=p.hurdle/100;let red=0,gr=0;
 const trw=TR.map(([k,l,g,x,d])=>{const s=st(T[k],g,x,d);red+=s=='R';gr+=s=='G';return`<tr><td class="L">${l}</td><td><input type="number" step="any" data-tr="${k}" value="${T[k]}"></td><td>${d>0?'≥'+g:'≤'+g}</td><td>${d>0?'<'+x:'>'+x}</td><td class="${s}">${{G:'Green',A:'Amber',R:'Red'}[s]}</td></tr>`}).join('');
 const call=red>=2?'Downgrade: move to SELL or cut the position':red==1?'Stay HOLD and review next quarter':gr>=4?`Upgrade to BUY once price is at or below ₹${n0(R.buy)}`:'Stay HOLD';
 const lad=[[500,'No buy'],[450,'25% of position'],[427,'35% of position'],[400,'40% of position'],[350,'Stop and re-underwrite']].map(([pr,t])=>{const c=R.price>0?Math.pow(R.price/pr,.2)-1:-1;return`<tr><td>₹${pr}</td><td class="${c>=h?'G':c>=h-.04?'A':'R'}">${pc(c)}</td><td>${pc(R.buy/pr-1)}</td><td class="L">${t}</td></tr>`}).join('');
 const cur={p,price:R.price,c:R.c},cols=[...PINS,cur],rows=[['Revenue CAGR',x=>x.p.cagr+'%'],['EBITDA margin',x=>x.p.margin+'%'],['Wage inflation',x=>x.p.wage+'%'],['Cap hit',x=>x.p.cap+'%'],['Exit P/E',x=>x.p.pe+'x'],['Entry price',x=>'₹'+x.p.entry],['FY31 price',x=>'₹'+n0(x.price)],['5-year return',x=>pc(x.c)],['Verdict',x=>verdict(x.c,x.p.hurdle)]];
 $('out3').innerHTML=`<div class="card"><h2>Trigger monitor</h2><p class="small">Enter the latest reported figures. Thresholds are set around the FY27E path in the deck.</p><div class="scroll"><table><tr><th class="L">KPI</th><th>Latest</th><th>Green</th><th>Red</th><th>Status</th></tr>${trw}</table></div><p><b>Call: ${call}</b> (${red} red, ${gr} green)</p></div>
 <div class="card"><h2>Entry ladder</h2><div class="scroll"><table><tr><th>Entry price</th><th>5-year return</th><th>Margin of safety vs buy-below</th><th class="L">Action</th></tr>${lad}</table></div><p class="small">Uses the FY31 price from your current sliders (₹${n0(R.price)}). Buy-below for your hurdle: ₹${n0(R.buy)}.</p></div>
 <div class="card"><h2>Compare cases</h2><button data-pin="add">Pin current case</button><button class="pin" data-pin="clear">Clear pins</button><div class="scroll"><table><tr><th class="L"></th>${PINS.map((_,i)=>`<th>Pin ${i+1}</th>`).join('')}<th>Current</th></tr>${rows.map(([l,f])=>`<tr><td class="L">${l}</td>${cols.map(x=>`<td>${f(x)}</td>`).join('')}</tr>`).join('')}</table></div></div>`}
function showTab(){['out','out2','out3'].forEach((id,i)=>$(id).classList.toggle('on',i==tab));[...$('tb').children].forEach((b,i)=>b.classList.toggle('act',i==tab))}
function tabsInit(){$('tb').innerHTML=['Model','Risk and simulation','Decision tools'].map((t,i)=>`<button data-t="${i}">${t}</button>`).join('');
 $('tb').onclick=e=>{if(e.target.dataset.t!=null){tab=+e.target.dataset.t;showTab()}};
 $('out2').onclick=e=>{const d=e.target.dataset;if(d.cap!=null)set({cap:+d.cap});if(d.derate)set({pe:Math.max(20,Math.round(V.pe*.64))})};
 $('out2').onchange=e=>{const k=e.target.dataset.rp;if(k){RP[k]=Math.max(0,+e.target.value||0);r()}};
 $('out3').onchange=e=>{const k=e.target.dataset.tr;if(k){T[k]=+e.target.value||0;r()}};
 $('out3').onclick=e=>{const a=e.target.dataset.pin;if(!a)return;if(a=='clear')PINS=[];else{const p=read(),R=calc(p);PINS.push({p,price:R.price,c:R.c});PINS=PINS.slice(-3)}r()};
 showTab()}
const r0=r;r=function(){r0();const p=read(),R=calc(p);r2(p,R);r3(p,R)};
tabsInit();build();r();
</script></body></html>
